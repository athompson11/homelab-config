apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/athompson11/homelab-config
    targetRevision: main
    path: clusters/homelab/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
