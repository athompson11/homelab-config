apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: observability
  source:
    repoURL: https://github.com/athompson11/homelab-config
    targetRevision: main
    path: apps/observability/kube-prometheus-stack
    helm:
      releaseName: observability
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
