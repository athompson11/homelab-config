apiVersion: apps/v1
kind: Deployment
metadata:
  name: streisandeffect-web
  namespace: streisandeffect
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: streisandeffect-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: streisandeffect-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.29-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: site
          persistentVolumeClaim:
            claimName: streisandeffect-documents
