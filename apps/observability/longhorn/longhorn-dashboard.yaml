apiVersion: v1
kind: ConfigMap
metadata:
  name: longhorn-homelab-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  longhorn-homelab-overview.json: |
    {
      "uid": "longhorn-homelab-overview",
      "title": "Longhorn / Homelab Overview",
      "tags": [
        "longhorn",
        "storage",
        "homelab"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            },
            "label": "Data Source"
          },
          {
            "name": "node",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": "label_values(longhorn_node_status, node)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "sort": 1,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Longhorn Nodes",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "longhorn_node_count_total"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Node Conditions Not Ready",
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 4,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "sum(longhorn_node_status{condition=~\"ready|schedulable|allowScheduling\",node=~\"$node\"} == 0)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Storage Used",
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 9,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "sum(longhorn_node_storage_usage_bytes{node=~\"$node\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Storage Scheduled",
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 14,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "sum(longhorn_node_storage_scheduled_bytes{node=~\"$node\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Volume Actual Size",
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 19,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "sum(longhorn_volume_actual_size_bytes)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Node Storage Used",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "longhorn_node_storage_usage_bytes{node=~\"$node\"}",
              "legendFormat": "{{node}} used"
            },
            {
              "expr": "longhorn_node_storage_capacity_bytes{node=~\"$node\"}",
              "legendFormat": "{{node}} capacity"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Volume Throughput",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "sum by (volume) (longhorn_volume_read_throughput)",
              "legendFormat": "{{volume}} read"
            },
            {
              "expr": "sum by (volume) (longhorn_volume_write_throughput)",
              "legendFormat": "{{volume}} write"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Volume IOPS",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "sum by (volume) (longhorn_volume_read_iops)",
              "legendFormat": "{{volume}} read"
            },
            {
              "expr": "sum by (volume) (longhorn_volume_write_iops)",
              "legendFormat": "{{volume}} write"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "iops"
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Manager CPU",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "longhorn_manager_cpu_usage_millicpu{node=~\"$node\"}",
              "legendFormat": "{{node}} / {{manager}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "mcores"
            }
          }
        },
        {
          "id": 10,
          "type": "table",
          "title": "Volume Robustness",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 20
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "longhorn_volume_robustness",
              "format": "table",
              "instant": true
            }
          ],
          "options": {
            "showHeader": true
          }
        }
      ]
    }
