kube-prometheus-stack:
  crds:
    # CRDs were installed during manual bootstrap; Argo manages the stack resources,
    # not kube-prometheus-stack's oversized CRD payloads.
    enabled: false

  windowsMonitoring:
    enabled: false

  alertmanager:
    enabled: true
    ingress:
      enabled: false
    service:
      type: ClusterIP
    alertmanagerSpec:
      replicas: 1
      retention: 120h
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi

  grafana:
    enabled: true
    defaultDashboardsTimezone: browser
    admin:
      existingSecret: observability-grafana
      userKey: admin-user
      passwordKey: admin-password
    ingress:
      enabled: false
    service:
      # Internal-only dashboard access on the Talos/OPNsense LAN.
      # Not routed through the public Traefik/OPNsense 80/443 port-forward.
      annotations:
        metallb.io/address-pool: ingress-pool
      type: LoadBalancer
      loadBalancerIP: 10.10.0.101
      loadBalancerSourceRanges:
        - 10.10.0.0/24
    persistence:
      enabled: true
      type: sts
      storageClassName: longhorn
      accessModes:
        - ReadWriteOnce
      size: 10Gi
    grafana.ini:
      analytics:
        reporting_enabled: false
        check_for_updates: false
      security:
        # Keep false while Grafana is internal-only and accessed by kubectl port-forward.
        # Re-enable when an HTTPS Traefik Ingress is added.
        cookie_secure: false
        strict_transport_security: false
      users:
        allow_sign_up: false
    additionalDataSources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-gateway.observability.svc.cluster.local
        isDefault: false
        editable: true
        jsonData:
          maxLines: 1000

  prometheus:
    enabled: true
    ingress:
      enabled: false
    service:
      type: ClusterIP
    prometheusSpec:
      replicas: 1
      retention: 14d
      retentionSize: 45GiB
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      scrapeConfigSelectorNilUsesHelmValues: false
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 50Gi

  prometheusOperator:
    admissionWebhooks:
      enabled: true
      patch:
        enabled: true

  # Talos does not run kube-proxy in this cluster state.
  kubeProxy:
    enabled: false

  # Keep the simple, reliable baseline enabled first. Talos control-plane static pod
  # metrics need intentional endpoint/certificate exposure; leave those off to avoid
  # false-down targets in the initial stack.
  kubeApiServer:
    enabled: true
  kubelet:
    enabled: true
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false

  nodeExporter:
    enabled: true
  prometheus-node-exporter:
    releaseLabel: true

  kubeStateMetrics:
    enabled: true
  kube-state-metrics:
    releaseLabel: true
