kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: youareanidiot
  name: youareanidiot-site-46565dh9km
  namespace: default
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: youareanidiot
  name: youareanidiot
  namespace: default
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app.kubernetes.io/name: youareanidiot
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: youareanidiot
  name: youareanidiot
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: youareanidiot
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        bb.abbie.dev/source-commit: d0a3b49964aefa023e87b1d7f632551364251273
      labels:
        app.kubernetes.io/name: youareanidiot
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - -g
        - daemon off;
        command:
        - nginx
        image: docker.io/nginxinc/nginx-unprivileged@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 30
        name: web
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: site
          readOnly: true
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 101
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          name: youareanidiot-site-46565dh9km
        name: site
      - emptyDir:
          sizeLimit: 16Mi
        name: tmp
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/name: youareanidiot
  name: youareanidiot
  namespace: default
spec:
  dnsNames:
  - youareanidiot.abbie.dev
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-production-abbie-cloudflare
  secretName: youareanidiot-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app.kubernetes.io/name: youareanidiot
  name: youareanidiot
  namespace: default
spec:
  ingressClassName: traefik
  rules:
  - host: youareanidiot.abbie.dev
    http:
      paths:
      - backend:
          service:
            name: youareanidiot
            port:
              name: http
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - youareanidiot.abbie.dev
    secretName: youareanidiot-tls
