data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#000000" />
        <title>You are an idiot!</title>
        <link rel="stylesheet" href="style.css" />
      </head>
      <body>
        <main>
          <section class="stage" aria-labelledby="headline">
            <p class="eyebrow">A harmless internet throwback</p>
            <h1 id="headline">YOU ARE AN IDIOT!</h1>

            <div class="faces" aria-hidden="true">
              <span>☺</span><span>☺</span><span>☺</span>
            </div>

            <div class="controls" aria-label="Experience controls">
              <button id="start" type="button">Start</button>
              <button id="pause" type="button" disabled>Pause</button>
              <button id="stop" type="button" disabled>Stop</button>
              <button id="mute" type="button" aria-pressed="false">Mute</button>
            </div>

            <p id="status" class="status" role="status" aria-live="polite">
              Press Start when you are ready. Sound is off until then.
            </p>
            <p class="hint">
              Tab to move between controls. Enter or Space activates them.
            </p>
          </section>
        </main>

        <!--
          Audio source: https://www.myinstants.com/media/sounds/you-are-an-idiot.mp3
          Retrieved 2026-11-02. SHA-256:
          7b8a3c88cd4fd30e172fd9714bf39c10d32e5728188f460cb3d5eb120730d36b
        -->
        <audio
          id="audio"
          loop
          preload="metadata"
          src="you-are-an-idiot.mp3"
        ></audio>
        <script src="script.js"></script>
      </body>
    </html>
  script.js: |
    (() => {
      const stage = document.querySelector('.stage');
      const audio = document.querySelector('#audio');
      const start = document.querySelector('#start');
      const pause = document.querySelector('#pause');
      const stop = document.querySelector('#stop');
      const mute = document.querySelector('#mute');
      const status = document.querySelector('#status');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      let state = 'stopped';
      let playAttempt = 0;
      let playPending = false;

      const setStatus = (message) => {
        status.textContent = message;
      };

      const render = () => {
        stage.classList.toggle(
          'is-running',
          state === 'playing' && !reducedMotion.matches
        );
        start.textContent = state === 'paused' ? 'Resume' : 'Start';
        start.disabled = state === 'playing' || playPending;
        pause.disabled = state !== 'playing';
        stop.disabled = state === 'stopped';
        mute.textContent = audio.muted ? 'Unmute' : 'Mute';
        mute.setAttribute('aria-pressed', String(audio.muted));
      };

      const play = async () => {
        if (playPending) return;
        playPending = true;
        render();
        const attempt = ++playAttempt;
        try {
          await audio.play();
          if (attempt !== playAttempt) return;
          state = 'playing';
          setStatus(
            reducedMotion.matches ? 'Playing with motion reduced.' : 'Playing.'
          );
        } catch (error) {
          if (attempt !== playAttempt) return;
          state = 'paused';
          setStatus(
            'Sound could not play. Check your browser settings or connection, then try Resume.'
          );
        }
        playPending = false;
        render();
      };

      start.addEventListener('click', play);

      pause.addEventListener('click', () => {
        playAttempt++;
        playPending = false;
        audio.pause();
        state = 'paused';
        setStatus('Paused.');
        render();
      });

      stop.addEventListener('click', () => {
        playAttempt++;
        playPending = false;
        audio.pause();
        audio.currentTime = 0;
        state = 'stopped';
        setStatus('Stopped and reset.');
        render();
      });

      mute.addEventListener('click', () => {
        audio.muted = !audio.muted;
        setStatus(audio.muted ? 'Sound muted.' : 'Sound unmuted.');
        render();
      });

      audio.addEventListener('error', () => {
        playAttempt++;
        playPending = false;
        state = 'paused';
        setStatus(
          'The audio file could not be loaded. The page and controls still work.'
        );
        render();
      });

      reducedMotion.addEventListener('change', () => {
        if (state === 'playing') {
          setStatus(
            reducedMotion.matches ? 'Playing with motion reduced.' : 'Playing.'
          );
        }
        render();
      });

      render();
    })();
  style.css: |
    :root {
      color-scheme: light dark;
      font-family: 'Courier New', Courier, monospace;
      background: #000;
      color: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 18rem;
      min-height: 100vh;
      margin: 0;
      background: #000;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      overflow: hidden;
    }

    .stage {
      width: min(100%, 64rem);
      text-align: center;
    }

    .eyebrow,
    .hint,
    .status {
      margin: 0.75rem auto;
    }

    .eyebrow {
      font-size: clamp(0.75rem, 2vw, 1rem);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    h1 {
      margin: 1rem 0;
      font-size: clamp(2.4rem, 10vw, 7rem);
      line-height: 0.95;
      letter-spacing: -0.07em;
    }

    .faces {
      display: flex;
      justify-content: center;
      gap: clamp(0.5rem, 3vw, 2rem);
      margin: 1.5rem 0 2rem;
      font-family: Arial, sans-serif;
      font-size: clamp(4rem, 15vw, 10rem);
      line-height: 1;
    }

    .stage.is-running .faces span {
      animation: bounce 1.4s ease-in-out infinite alternate;
    }

    .stage.is-running .faces span:nth-child(2) {
      animation-delay: -0.45s;
    }

    .stage.is-running .faces span:nth-child(3) {
      animation-delay: -0.9s;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
    }

    button {
      min-width: 6.5rem;
      border: 0.18rem solid currentColor;
      border-radius: 0;
      padding: 0.7rem 1rem;
      background: #fff;
      color: #000;
      font: bold 1rem/1 'Courier New', Courier, monospace;
      cursor: pointer;
    }

    button:hover:not(:disabled),
    button:focus-visible {
      background: #000;
      color: #fff;
      outline: 0.2rem solid #fff;
      outline-offset: 0.2rem;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .status {
      min-height: 2.5em;
      max-width: 38rem;
      font-weight: bold;
    }

    .hint {
      max-width: 38rem;
      font-size: 0.85rem;
    }

    @keyframes bounce {
      from {
        transform: translateY(-0.15em) rotate(-5deg);
      }
      to {
        transform: translateY(0.15em) rotate(5deg);
      }
    }

    @media (max-width: 32rem) {
      main {
        padding: 1rem;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      button {
        min-width: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .stage.is-running .faces span {
        animation: none;
      }
    }
